    <!--
      Security headers (meta-tag fallback). Real HTTP headers are also set in
      /public/_headers for Netlify/Cloudflare Pages style hosts. Headers that
      are ignored as <meta> (HSTS, X-Frame-Options, COOP/COEP, Permissions-
      Policy in some browsers) live in /public/_headers only.

      CSP notes:
      - 'unsafe-inline' on script-src is required by Vite's runtime + Lovable's
        editor injection. It will be tightened to nonces only when the app
        moves to a server-rendered host.
      - connect-src must allow Supabase (auth + edge functions), Kalshi
        (demo + prod), Coinbase (BTC spot), and the configurable CORS proxy.
        Public CORS proxies users may opt into are listed explicitly.
      - frame-ancestors is intentionally permissive in the meta tag so the
        Lovable editor preview keeps working. The /public/_headers file ships
        a stricter X-Frame-Options for production.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.gpteng.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.elections.kalshi.com https://demo-api.kalshi.co https://api.coinbase.com https://api.exchange.coinbase.com https://corsproxy.io https://api.codetabs.com https://api.allorigins.win; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none';"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Permissions-Policy"
      content="geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()"
